
{% load static %}


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <link rel="stylesheet" href="{% static 'styles/forget.css' %}">
</head>
<body>

    <div class="forgot-container">

        <h2>Forgot Password</h2>
        {% include "pages/msg.html" %}
        <p>Reset your password here</p>

        <form method="POST" action="#">
            {% csrf_token %}

            <div class="input-group">
                <label>Username</label>
                <input type="email" name="username" placeholder="Enter your username" >
            </div>

            <div class="input-group">
                <label>New Password</label>
                <input type="password" name="password" placeholder="Enter new password" >
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" name="cpassword" placeholder="Confirm new password" >
            </div>

            <button type="submit">Submit</button>

        </form>

    </div>

</body>
</html>
