<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Details</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f6f8;
        }

        .product-card {
            max-width: 1100px;
            margin: 60px auto;
            background: #fff;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .product-image {
            width: 100%;
            height: 450px;
            object-fit: contain;
            border-radius: 15px;
            background: #f8f9fa;
            padding: 20px;
        }

        .product-title {
            font-size: 32px;
            font-weight: 700;
        }

        .product-price {
            font-size: 28px;
            font-weight: 700;
            color: #198754;
        }

        .product-description {
            color: #6c757d;
            line-height: 1.7;
        }

        .qty-value {
            width: 70px;
            text-align: center;
            font-weight: 600;
        }

        .buy-btn {
            padding: 12px 35px;
            font-size: 17px;
            font-weight: 600;
            border-radius: 10px;
        }

        @media (max-width: 767px) {
            .product-card {
                margin: 20px 12px;
                padding: 20px;
            }

            .product-image {
                height: 300px;
            }

            .product-title {
                font-size: 25px;
                margin-top: 25px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="product-card">

        <div class="row g-5 align-items-center">

            <!-- LEFT SIDE : IMAGE -->
            <div class="col-md-6">

                {% if product.product_image %}
                    <img src="{{ product.product_image.url }}" class="product-image" alt="{{ product.name }}">
                {% else %}
                    <img src="https://via.placeholder.com/600x600" class="product-image" alt="Product">
                {% endif %}

            </div>


            <!-- RIGHT SIDE : DETAILS -->
            <div class="col-md-6">

                <h1 class="product-title">
                    {{ product.name }}
                </h1>

                <div class="mb-3">
                    ⭐⭐⭐⭐⭐
                    <span class="text-muted">(125 Reviews)</span>
                </div>

                <div class="product-price mb-3">
                   <strong>₹{{ product.price }}</strong>
                </div>

                <p class="product-subtitle">{{ product.desc }}</p>


               


                <!-- QUANTITY -->
                <div class="mb-4">

                    <label class="form-label fw-semibold">
                        Quantity: <span id="qtyText">1</span>
                    </label>

                    <input type="range"
                           class="form-range"
                           id="quantity"
                           min="1"
                           max="10"
                           value="1">

                </div>


                <!-- BUY NOW -->
                <a class="btn btn-primary buy-btn w-100" href="{% url 'add_to_cart' product_id=product.id %}">
                    🛒 Add to Cart
                </a>

            </div>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>

    const quantity = document.getElementById("quantity");
    const qtyText = document.getElementById("qtyText");

    quantity.addEventListener("input", function () {
        qtyText.textContent = this.value;
    });

</script>

</body>
</html>
